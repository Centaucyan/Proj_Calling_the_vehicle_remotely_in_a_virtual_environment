# ==============================================================================
# 1. PointCloud -> LaserScan 변환 노드 파라미터
# ==============================================================================
pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "velodyne_link"
    transform_tolerance: 0.01
    # 🌟 바닥(Z=0)이 스캔에 포함되어 장애물(검은색)로 인식되는 것을 막기 위해 상향 조정 (LiDAR Z=0.35)
    min_height: -0.1
    max_height: 1.0
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.3
    range_max: 20.0
    use_sim_time: true


# ==============================================================================
# 2. SLAM Toolbox 노드 파라미터
# ==============================================================================
slam_toolbox:
  ros__parameters:
    # Solver settings
    # solver_plugin: solver_plugins::CspaSolver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Frame & Topic settings
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Transform & Timing
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    use_sim_time: true

    # Map resolution settings
    resolution: 0.05
    max_laser_range: 20.0